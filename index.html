<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>コアイメージ英語</title>

<!-- アプリとしてインストールするための設定 -->
<link rel="manifest" href="manifest.webmanifest">
<meta id="tc" name="theme-color" content="#f6f5f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="コア英語">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<script>
/* 最初の描画より前に設定を反映する。あとから当てると一瞬もとの見た目が出る */
(function(){
  try{
    var o = JSON.parse(localStorage.getItem('coreEn.v1') || '{}').set || {};
    var r = document.documentElement;
    if(o.theme && o.theme !== 'auto')   r.setAttribute('data-theme', o.theme);
    if(o.accent && o.accent !== 'orange') r.setAttribute('data-accent', o.accent);
    if(o.fs) r.style.setProperty('--fs', o.fs);
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="view"></main>
<div id="panel"></div>
<nav id="tabs">
  <button data-tab="book"   aria-selected="true"><span class="ic">📖</span>教科書</button>
  <button data-tab="quiz"   aria-selected="false"><span class="ic">✍️</span>演習</button>
  <button data-tab="vocab"  aria-selected="false"><span class="ic">🔤</span>単語</button>
  <button data-tab="review" aria-selected="false"><span class="ic">🔁</span>復習</button>
</nav>
<script src="diagrams.js"></script>
<script src="data/particles.js"></script>
<script src="data/verbs.js"></script>
<script src="data/grammar.js"></script>
<script src="data/words.js"></script>
<script src="data/phrasals.js"></script>
<script src="data/vocab.js"></script>
<script src="data/vocab-senses.js"></script>
<script src="data/vocab-art.js"></script>
<script src="data/exercises.js"></script>
<script src="app.js"></script>
<script>
/* オフラインでも学習を続けられるように Service Worker を登録する */
if('serviceWorker' in navigator){
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
/* Chrome がインストール可能と判断したら、教科書タブに追加ボタンを出す */
addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  window.__installPrompt = e;
  if(typeof render === 'function' && state.tab === 'book' && !state.page) render();
});
addEventListener('appinstalled', () => {
  window.__installPrompt = null;
  if(typeof render === 'function') render();
});
</script>
</body>
</html>
